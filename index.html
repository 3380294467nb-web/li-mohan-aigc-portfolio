iv",{className:"capability-ledger",children:[c.jsxs("header",{"data-reveal":"capability-heading",children:[c.jsx("span",{children:"CAPABILITY MATRIX"}),c.jsxs("h2",{children:["能力不是软件数量，",c.jsx("br",{}),"而是判断链条。"]})]}),c.jsx("div",{className:"capability-rows",children:Qv.map((r,j)=>c.jsxs("article",{"data-reveal":"capability-row",children:[c.jsx("i",{children:String(j+1).padStart(2,"0")}),c.jsxs("div",{children:[c.jsx("span",{children:r.title}),c.jsx("h3",{children:r.subtitle})]}),c.jsx("p",{children:r.items.join(" / ")})]},r.title))})]}),c.jsxs("div",{className:"tool-ledger",children:[c.jsxs("div",{className:"tool-ledger-title",children:[c.jsx("span",{children:"PRODUCTION TOOLCHAIN"}),c.jsx("strong",{children:"在项目中被调用的工具栈"})]}),Xv.map((r,j)=>c.jsxs("article",{"data-reveal":"tool-row",children:[c.jsx("span",{children:String(j+1).padStart(2,"0")}),c.jsx("h3",{children:r.title}),c.jsx("p",{children:r.items.join(" · ")})]},r.title))]})]})}const Ca=[{id:"script",number:"01",title:"Script Reading",zh:"剧本分析",summary:"提炼戏核、人物关系、爽点、情绪钩子",goal:"先判断这一段为什么值得看，再决定镜头如何释放信息。",problem:"剧本文字只提供事件，AI 直接生成容易缺少短剧钩子和情绪重点。",judgement:"观众停留来自人物关系、反应镜头、信息差和段尾悬念，而不是单纯画面奇观。",solution:"提炼戏核、人物关系、爽点、情绪钩子和段尾悬念，形成分镜输入。"},{id:"shot",number:"02",title:"Shot Breakdown",zh:"分镜拆解",summary:"将剧本文字拆成适合 9:16 竖屏短剧的镜头",goal:"把文字情节转化为能被 AI 视频模型执行的镜头单位。",problem:"长段剧本直接生成会导致主体过多、信息拥挤、镜头节奏不清。",judgement:"竖屏短剧需要更明确的主体、反应镜头和段尾节奏点。",solution:"按情绪与动作拆镜，控制每镜主体数量、景别和信息密度。"},{id:"asset",number:"03",title:"Asset Binding",zh:"资产绑定",summary:"角色、服装、场景、道具、怪物、特效统一管理",goal:"让多段镜头共享同一套角色和场景基准。",problem:"多轮生成中角色、服装、道具和场景容易漂移。",judgement:"生成前必须先建立稳定资产描述，不能让每个镜头自由发挥。",solution:"建立资产绑定表，把角色外观、服装、道具和场景锚点统一管理。"},{id:"camera",number:"04",title:"Camera Direction",zh:"镜头设计",summary:"景别、机位、运镜、构图、表演节奏、反应镜头",goal:"把导演意图落实到镜头调度和画面层次。",problem:"只写剧情会让模型输出平铺直叙的画面，缺少影视化调度。",judgement:"导演语言必须落到景别、机位、运镜、站位和表演动作。",solution:"为每段写清镜头调度、空间锚点、人物朝向和反应镜头。"},{id:"prompt",number:"05",title:"Prompt Engineering",zh:"提示词生成",summary:"将导演语言转化为 AI 视频模型可执行指令",goal:"让模型看到具体画面，而不是抽象情绪。",problem:"抽象词、代词和上下文依赖会降低视频模型执行稳定性。",judgement:"提示词需要自包含、具体、正向描述，并降低误读空间。",solution:"把情绪和节奏转译成动作、表情、机位、光线、构图和材质描述。"},{id:"continuity",number:"06",title:"Continuity Interface",zh:"段间接口",summary:"解决 AI 视频模型无记忆导致的连续性问题",goal:"让上一段结尾成为下一段开头的硬状态。",problem:"视频模型单段无记忆，下一段容易换位、断动作或丢道具。",judgement:"每段结尾状态必须成为下一段开头的硬接口。",solution:"记录结束姿态、空间位置、摄影机方向、角色朝向和动作承接。"},{id:"qa",number:"07",title:"QA & Revision",zh:"自审修正",summary:"修正角色漂移、空间混乱、动作假、CG感过重、道具丢失",goal:"把生成错误拆成可修正的问题类型。",problem:"一次生成很难同时满足表演、连续性、材质和镜头质感。",judgement:"需要把错误分类，而不是笼统地说重新生成。",solution:"针对角色漂移、空间混乱、动作假、CG感重、道具丢失分别修正。"},{id:"sop",number:"08",title:"Reusable SOP",zh:"结果复盘",summary:"沉淀可复用提示词模板和镜头规则",goal:"让单次经验进入下一次生产，而不是停留在偶然成功。",problem:"没有复盘，单次生成经验无法进入团队生产标准。",judgement:"有效经验要抽象成跨题材规则，供后续项目复用。",solution:"沉淀提示词模板、镜头规则、避坑卡和组内质量检查表。"}];function Vv(){const[r,j]=nl.useState(Ca[0].id),z=Ca.find(d=>d.id===r)||Ca[0];return Ca.findIndex(d=>d.id===r),c.jsxs("section",{className:"pipeline-narrative",id:"workflow",children:[c.jsxs("div",{className:"pipeline-hero",children:[c.jsx("img",{src:"data:image/webp;base64,UklGRlSzAQBXRUJQVlA4IEizAQBwJQidASqIBq0DPkkij0WioiElozCKaLAJCWlu3JtfLwD9yzr/d1qR73Zv622znxGNZ9Cn828cf+Tzp+cr0P/jc2c3fqJqcthefTfGbVd0u+Jtc9AjzbM2tx9zYeON6j82m4b/+6u/l59PSP2J/8/q+xblyeT5n/wnfe9Kn+K9Q3/l+ir05f3//3+ob91PWc/9f7g+8f/jeoB/zOp//s//l/////+Cb9vvWc/+3s6f3j/2+mz///YA///t1fwD//9af3G/6v+R9XXyr+a/6P29+oP5R9o/wf8X/pf/B/jPnKwz/H+B388/TX97/M+yf+8/8v+w/L31Z/Lf4j/w/5f8tPkR/IP51/kP7n+7P+D+Ej8D/0/73ygtR/4X/u/3fsNexn2L/l/4z/Vf/f/MfHv+16Df2X/C9gT/T/6j138Tb956ifi9//X++9V35t/wP/n/tvgT/lX98/8P+T/K0d4bV6K2TS9f7c1OzZbDNvsFRpv464yJSA6na+dvcAm2Tr1lw7AMMYysFQCLw5zH0kDxIVBpSCMJyDK8SCuMbZ+IyeDbJ1FIkGi99rxCK2Trl3nRCAAXAAIpKJ6jCF/NlRjGDdvWJ/awERtDk3Pr9FzpExOLWrSHwEmSlmwu6TUfcw6tDjqacJzII3NpnTkn6k4EcMFUJ2lgmUEu7rIx7JIn1snXLwRwujyChU8dtP1i2SdB+gJyVwOZyuWsQBgALofk4EXagJj4kDQPdmCuIoNCxrmhqJKN1DBYP1xF2iKM3IBPK0TcV12FRNXxcTlZQgT5+2S/nPFbJxzouNGmKc7eBnF2gnBu0+DrsedKkbqgHoDTI2Ih7aTdDiDrD0lVexac5tcudFtyHOrvbd48/GDb
